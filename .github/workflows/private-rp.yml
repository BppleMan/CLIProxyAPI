name: private-rp-regression

on:
  push:
    branches: ['rp/**', 'sync/**']
  pull_request:
    branches: ['rp/main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Affinity and quota failover regressions
        run: go test ./internal/rpmode ./sdk/cliproxy/session ./sdk/cliproxy/auth ./internal/api/middleware -run 'Test(FrontendSession|PrivateRP|ManagerExecuteAndStreamRebindOnQuotaEndToEnd|ManagerSessionAffinityRebindOnQuota)' -count=1
      - name: RP payload and logging regressions
        run: go test ./internal/translator/antigravity/openai/chat-completions ./internal/logging ./internal/runtime/executor -run 'Test(PrivateRP|AntigravityBuildRequest|ConvertOpenAIRequestToAntigravity)' -count=1
      - name: Antigravity quota contract and HTTP boundary
        run: go test ./internal/runtime/executor/helps ./sdk/api/handlers ./test -run TestPrivateRPQuota -count=1
      - name: Quota concurrency checks
        run: go test -race ./sdk/cliproxy/auth ./test -run TestPrivateRPQuota -count=1
      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/cliproxy-rp ./cmd/server
