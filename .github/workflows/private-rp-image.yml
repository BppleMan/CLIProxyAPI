name: private-rp-image

on:
  push:
    branches: ['rp/main']
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - deploy/image/**
      - .github/workflows/private-rp-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'BppleMan/CLIProxyAPI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: RP regression gate
        run: |
          go test ./internal/rpmode ./sdk/cliproxy/session ./sdk/cliproxy/auth ./internal/api/middleware -run 'Test(FrontendSession|PrivateRP|ManagerExecuteAndStreamRebindOnQuotaEndToEnd|ManagerSessionAffinityRebindOnQuota)' -count=1
          go test ./internal/translator/antigravity/openai/chat-completions ./internal/logging ./internal/runtime/executor -run 'Test(PrivateRP|AntigravityBuildRequest|ConvertOpenAIRequestToAntigravity)' -count=1
          go test ./internal/runtime/executor/helps ./sdk/api/handlers ./test -run TestPrivateRPQuota -count=1
      - name: Build Linux binary with source revision
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p build
          go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=rp-${GITHUB_SHA::12} -X main.Commit=${GITHUB_SHA}" -o build/cliproxyapi ./cmd/server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-addressed image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bppleman/cliproxyapi-rp:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/bppleman/cliproxyapi-rp@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
